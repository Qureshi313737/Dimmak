name: Build Android APK

on:
  push:
    branches: [main, ccr-f5a1964d-gtz4tg]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Bundle the web app into the APK assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r index.html css js vendor models android/app/src/main/assets/

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AnatomyExplorer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AnatomyExplorer-apk
          path: AnatomyExplorer.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Anatomy Explorer APK v1.0.${{ github.run_number }}
          body: |
            Android APK of Anatomy Explorer 3D (works offline).
            Download **AnatomyExplorer.apk**, open it on your phone and allow "Install unknown apps" when asked.
          files: AnatomyExplorer.apk
          make_latest: true
